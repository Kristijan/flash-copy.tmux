name: Plugin Testing

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run type checking with ty
        run: uv run ty check --output-format=github

      - name: Run linting with ruff
        run: uv run ruff check --output-format=github

      - name: Check formatting with ruff
        run: uv run ruff format --check

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Build tmux 3.8 for native floating-pane tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libevent-dev libncurses-dev bison
          build_dir="$(mktemp -d)"
          curl --fail --location --retry 3 \
            https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz \
            --output "$build_dir/tmux.tar.gz"
          echo "e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e  $build_dir/tmux.tar.gz" | sha256sum --check
          tar -xzf "$build_dir/tmux.tar.gz" -C "$build_dir"
          cd "$build_dir/tmux-3.8"
          ./configure --prefix="$RUNNER_TEMP/tmux-3.8"
          make -j2
          make install
          echo "$RUNNER_TEMP/tmux-3.8/bin" >> "$GITHUB_PATH"

      - name: Run tests with pytest
        env:
          FLASH_COPY_REQUIRE_TMUX: "1"
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
